image: ruby:3.2

deploy-pages:
  stage: deploy
  variables:
    JEKYLL_ENV: production
  before_script:
    - gem install bundler -v 2.4.22 --no-document
    - bundle _2.4.22_ config set --local path vendor/bundle
    - bundle _2.4.22_ install
  script:
    # Derive both the origin and optional project path from GitLab's Pages URL.
    - ruby scripts/gitlab_pages_config.rb /tmp/gitlab-pages.yml
    - bundle _2.4.22_ exec jekyll build --config _config.yml,/tmp/gitlab-pages.yml
  pages:
    publish: _site
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
