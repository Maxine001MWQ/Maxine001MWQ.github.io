<!doctype html><html lang="{{ page.lang | default: 'zh-CN' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | default: site.title | escape }}</title><link rel="canonical" href="{{ page.redirect_to | absolute_url }}"><meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}"><meta name="robots" content="noindex"></head><body><p><a href="{{ page.redirect_to | relative_url }}">{{ page.title | default: site.title }}</a></p>{% if page.url == '/' %}<p><a href="{{ '/en/' | relative_url }}" lang="en">English</a></p>{% endif %}</body></html>
